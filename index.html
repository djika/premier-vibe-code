<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma première page vibecodée</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @keyframes float-in {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .animate-float-in { animation: float-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .animate-pop      { animation: pop 0.35s ease-out; }

    @media (prefers-reduced-motion: reduce) {
      .animate-float-in, .animate-pop { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Halos décoratifs en arrière-plan -->
  <div class="pointer-events-none absolute -top-32 -left-24 h-80 w-80 rounded-full bg-indigo-500/25 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-40 -right-20 h-96 w-96 rounded-full bg-fuchsia-500/20 blur-3xl"></div>

  <main class="relative w-full max-w-xl">
    <article class="animate-float-in rounded-3xl border border-white/10 bg-white/5 p-8 sm:p-12 backdrop-blur-xl shadow-2xl shadow-black/40 text-center">

      <span class="inline-block rounded-full border border-indigo-400/30 bg-indigo-400/10 px-4 py-1 text-xs font-medium uppercase tracking-widest text-indigo-300">
        Premier projet
      </span>

      <h1 class="mt-6 bg-gradient-to-r from-indigo-300 via-sky-300 to-fuchsia-300 bg-clip-text text-4xl font-extrabold leading-tight text-transparent sm:text-5xl">
        Ma première page vibecodée
      </h1>

      <p class="mt-5 text-base leading-relaxed text-slate-300 sm:text-lg">
        Bienvenue&nbsp;! Cette page a été générée en un seul fichier HTML, sans build ni dépendance
        à installer. Le style est assuré par Tailwind CSS chargé depuis un CDN.
        Cliquez sur le bouton ci-dessous pour dire bonjour.
      </p>

      <button
        id="greet-btn"
        type="button"
        class="mt-8 inline-flex items-center gap-2 rounded-xl bg-indigo-500 px-7 py-3 text-base font-semibold text-white shadow-lg shadow-indigo-500/30 transition hover:-translate-y-0.5 hover:bg-indigo-400 hover:shadow-indigo-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 active:translate-y-0"
      >
        Cliquez ici
      </button>

      <p
        id="greeting"
        role="status"
        aria-live="polite"
        class="mt-6 text-2xl font-bold text-emerald-300 opacity-0 transition-opacity duration-300"
        hidden
      ></p>

    </article>

    <p class="mt-6 text-center text-xs text-slate-500">
      Fichier unique · Tailwind CSS via CDN
    </p>
  </main>

  <script>
    const btn = document.getElementById('greet-btn');
    const greeting = document.getElementById('greeting');

    btn.addEventListener('click', () => {
      greeting.textContent = 'Bonjour ! 👋';
      greeting.hidden = false;
      // Laisse le navigateur peindre l'état "hidden" avant de lancer la transition
      requestAnimationFrame(() => greeting.classList.replace('opacity-0', 'opacity-100'));

      greeting.classList.remove('animate-pop');
      void greeting.offsetWidth; // force le redémarrage de l'animation
      greeting.classList.add('animate-pop');
    });
  </script>
</body>
</html>
